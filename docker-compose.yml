services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      DESK_MODE: paper
      DATA_DIR: /data
      CONFIG_DIR: /config
      STATIC_DIR: /app/static
      SNIPER_INGEST_SECRET: ${SNIPER_INGEST_SECRET:-local-dev-secret}
    volumes:
      - desk_data:/data

  # Fallback sniper (PumpPortal WS) — use when no Helius gRPC key
  sniper-py:
    build:
      context: .
      dockerfile: apps/sniper/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8787
      SNIPER_INGEST_SECRET: ${SNIPER_INGEST_SECRET:-local-dev-secret}
      PUMPPORTAL_API_KEY: ${PUMPPORTAL_API_KEY:-}
    depends_on:
      - orchestrator
    profiles:
      - fallback

  # Primary sniper (Yellowstone gRPC) — best latency
  sniper-rs:
    build:
      context: .
      dockerfile: apps/sniper-rs/Dockerfile
    environment:
      HELIUS_API_KEY: ${HELIUS_API_KEY:?Set HELIUS_API_KEY for Yellowstone sniper}
      YELLOWSTONE_GRPC_ENDPOINT: ${YELLOWSTONE_GRPC_ENDPOINT:-https://grpc.helius-rpc.com}
      ORCHESTRATOR_URL: http://orchestrator:8787
      SNIPER_INGEST_SECRET: ${SNIPER_INGEST_SECRET:-local-dev-secret}
    depends_on:
      - orchestrator

volumes:
  desk_data:
