services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build:
      context: ./apps/orchestrator
    ports:
      - "8787:8787"
    environment:
      REDIS_URL: redis://redis:6379
      DESK_MODE: paper
    depends_on:
      - redis
    volumes:
      - ./config:/config:ro

  onyx:
    build:
      context: ./apps/onyx
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8787
    depends_on:
      - orchestrator
