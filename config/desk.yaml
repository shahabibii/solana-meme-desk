# Desk feed strategy — Fomo Copy Mode (smart-money first, no raw pump firehose)

fomo_copy_mode: true
pump_launch_feed: false
helius_wallet_watch: true
cope_poll_sec: 20

# Only these sources enter the agent pipeline when fomo_copy_mode is on
allowed_sources:
  - copy
  - convergence
  - fomo

# Lower bar for copy/convergence signals (pump launches disabled anyway)
entry_min_score:
  default: 72
  copy: 65
  convergence: 68
  fomo: 68

# Copy-trading improvements (convergence, mirror sells, smart dedup)
copy_improvements:
  convergence_window_sec: 600
  convergence_min_wallets: 2
  convergence_boost_per_wallet: 12
  convergence_size_step: 0.15
  convergence_size_cap: 2.0
  mirror_sell_enabled: true
  mirror_sell_fraction: 0.5
  mirror_sell_full_wallets: 2
  retry_after_block: true
