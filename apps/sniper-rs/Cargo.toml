[package]
name = "meme-sniper-rs"
version = "0.1.0"
edition = "2021"
description = "Yellowstone gRPC sniper for Pump.fun → Onyx orchestrator ingest"

[dependencies]
anyhow = "1"
bs58 = "0.5"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
yellowstone-grpc-client = "6.0.0"
yellowstone-grpc-proto = "6.0.0"
