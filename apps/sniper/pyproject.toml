[project]
name = "solana-meme-desk-sniper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.scripts]
meme-sniper = "sniper.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sniper*"]
